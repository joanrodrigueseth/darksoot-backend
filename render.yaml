databases:
  - name: darksoot-db
    plan: free
    databaseName: darksoot
    user: darksoot

services:
  - type: web
    name: darksoot-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: darksoot-db
          property: connectionString
